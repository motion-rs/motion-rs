[package]
name = "motion-content"
version.workspace = true
edition.workspace = true
description = "Backend-independent images, text, vectors, particles and artwork"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["image", "svg", "text", "particles", "ink", "diagram", "captions"]
image = ["dep:image", "dep:gif"]
svg = ["image", "text", "dep:usvg"]
text = ["image", "dep:fontdb", "dep:cosmic-text", "dep:skrifa", "dep:ttf-parser", "dep:unicode-linebreak"]
particles = ["image"]
ink = ["image"]
diagram = ["text"]
captions = ["text"]
gpu = ["dep:bytemuck"]
serde = ["dep:serde"]
schema = ["serde", "dep:schemars"]

[dependencies]
motion-core = { version = "0.2.0", path = "../motion-core" }
libm = "0.2"
half = "2"
kurbo = "0.13"
svgtypes = "0.16"
unicode-segmentation = "1.12"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }
gif = { version = "0.14", optional = true }
usvg = { version = "0.49", default-features = false, features = ["text", "system-fonts"], optional = true }
fontdb = { version = "0.24", optional = true }
cosmic-text = { version = "0.19", default-features = false, features = ["std"], optional = true }
skrifa = { version = "0.44", default-features = false, features = ["std"], optional = true }
ttf-parser = { version = "0.25", optional = true }
unicode-linebreak = { version = "0.1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
schemars = { version = "1", optional = true }

[dev-dependencies]
motion-render = { path = "../motion-render", features = ["gpu"] }
motion-encode = { path = "../motion-encode", default-features = false, features = ["audio"] }
tempfile = "3"
png = "0.18"
[lints]
workspace = true
