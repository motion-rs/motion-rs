[package]
name = "motion-render"
version.workspace = true
edition.workspace = true
description = "Shared bounded raster preparation and CPU/GPU rendering"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
motion-core = { version = "0.1.0", path = "../motion-core" }
libm = "0.2"
half = "2"
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
kurbo = "0.13"
rayon = "1.12"
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "0.4", optional = true }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "metal", "wgsl"], optional = true }

[dev-dependencies]
motion-content = { path = "../motion-content", default-features = false, features = ["image"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
