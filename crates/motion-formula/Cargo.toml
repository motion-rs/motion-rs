[package]
name = "motion-formula"
version.workspace = true
edition.workspace = true
description = "Typst-only compilation into shared motion vector content"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["formula"]
typst = []
formula = ["typst"]
gpu = []

[dependencies]
motion-core = { version = "0.1.0", path = "../motion-core" }
motion-content = { version = "0.1.0", path = "../motion-content", default-features = false, features = ["text", "svg"] }
libm = "0.2"
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"
unicode-normalization = "0.1"
fontdb = "0.24"
kurbo = "0.13"
rustybuzz = "0.20"

[dev-dependencies]
motion-render = { path = "../motion-render", features = ["gpu"] }
tempfile = "3"
[lints]
workspace = true
