[package]
name = "motion-scene"
version.workspace = true
edition.workspace = true
description = "Declarative JSON scene documents for motion timelines"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
vector = ["dep:motion-content"]
image = ["vector", "motion-content/image"]
svg = ["image", "text", "motion-content/svg"]
text = ["image", "motion-content/text"]
particles = ["image", "motion-content/particles"]
diagram = ["text", "motion-content/diagram"]
captions = ["text", "motion-content/captions"]
formula = ["text", "dep:motion-formula", "motion-formula/formula"]
audio = ["dep:motion-encode", "motion-encode/audio"]

[dependencies]
motion-core = { version = "0.1.0", path = "../motion-core" }
motion-render = { version = "0.1.0", path = "../motion-render", default-features = false }
motion-content = { version = "0.1.0", path = "../motion-content", default-features = false, optional = true }
motion-formula = { version = "0.1.0", path = "../motion-formula", default-features = false, optional = true }
motion-encode = { version = "0.1.0", path = "../motion-encode", default-features = false, optional = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"

[dev-dependencies]
motion-encode = { path = "../motion-encode", default-features = false, features = ["audio"] }
tempfile = "3"

[lints]
workspace = true
