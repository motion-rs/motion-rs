[package]
name = "motion-studio"
version.workspace = true
edition.workspace = true
description = "Native desktop preview, playback and export workbench"
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
studio = ["dep:motion-content"]
ffmpeg = []
gpu = ["motion-render/gpu", "motion-encode/gpu"]

[dependencies]
motion-core = { version = "0.2.0", path = "../motion-core" }
motion-content = { version = "0.2.0", path = "../motion-content", default-features = false, optional = true }
motion-render = { version = "0.2.0", path = "../motion-render", default-features = false }
motion-encode = { version = "0.2.0", path = "../motion-encode", default-features = false, features = ["ffmpeg"] }
motion-ffmpeg = { version = "0.2.0", path = "../motion-ffmpeg" }
cpal = { version = "0.16", default-features = false }
rtrb = "0.3"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui-phosphor = "0.14"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tempfile = "3"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "metal", "wgsl"] }

[dev-dependencies]
motion-content = { path = "../motion-content", features = ["text"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
libm = "0.2"
[lints]
workspace = true
