[workspace]
members = ["crates/motion", "crates/motion-core", "crates/motion-render", "crates/motion-content", "crates/motion-formula", "crates/motion-encode", "crates/motion-scene", "crates/motion-studio", "crates/motion-cli", "crates/motion-ffmpeg", "crates/motion-bench", "gallery"]
default-members = ["crates/motion"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/motion-rs/motion-rs"
keywords = ["animation", "motion-graphics", "video", "rendering", "gpu"]
categories = ["graphics", "multimedia::video", "rendering"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
